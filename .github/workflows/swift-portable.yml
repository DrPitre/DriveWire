name: Portable Swift server
on:
  push:
    branches: [main, swift-portable-server]
    paths: ['swift/**', 'scripts/**', 'desktop/**', '.github/workflows/swift-portable.yml']
  pull_request:
    paths: ['swift/**', 'scripts/**', 'desktop/**', '.github/workflows/swift-portable.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@d8e84bc3a450686a95474d7d6fa4a3301498debc
        if: runner.os != 'Windows'
        with:
          swift-version: '6.4.2'
      - uses: compnerd/gha-setup-swift@57fe462cd3c7b05ae8fcff79b00719312e305257
        if: runner.os == 'Windows'
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
      - name: Prepare Windows SwiftNIO
        if: runner.os == 'Windows'
        run: python scripts/prepare-swift.py
      - run: swift test --package-path swift
      - run: swift build --package-path swift -c release
      - name: Managed server test
        shell: bash
        run: python scripts/test-managed-server.py "$(swift build --package-path swift -c release --show-bin-path)/drivewire-server${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Serial transport test
        shell: bash
        run: python scripts/test-serial-server.py "$(swift build --package-path swift -c release --show-bin-path)/drivewire-server${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: TCP smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: python3 scripts/test-portable-server.py "$(swift build --package-path swift -c release --show-bin-path)/drivewire-server"
      - name: Bundle Windows runtime and test executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = swift build --package-path swift -c release --show-bin-path
          $info = swift -print-target-info | ConvertFrom-Json
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$bin/drivewire-server.exe" dist/
          $paths = @($info.paths.runtimeLibraryPaths) + @((Split-Path (Get-Command swift).Source))
          foreach ($path in $paths) {
            Get-ChildItem $path -Filter '*.dll' -ErrorAction SilentlyContinue | Copy-Item -Destination dist -Force
          }
          python scripts/test-portable-server.py dist/drivewire-server.exe --isolate-runtime
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: drivewire-server-windows-x64
          path: dist/
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwxgtk3.2-dev xvfb patchelf
      - name: Build wxWidgets desktop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $server = "$(swift build --package-path swift -c release --show-bin-path)/drivewire-server.exe"
          cmake -S desktop -B desktop/build -DDRIVEWIRE_FETCH_WX=ON -DDRIVEWIRE_SERVER="$server"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build desktop/build --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item dist/*.dll desktop/build/Release/ -Force
          python scripts/test-desktop.py "desktop/build/Release/DriveWire Desktop.exe" --server desktop/build/Release/drivewire-server.exe
      - name: Build wxWidgets desktop (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          fetch=OFF
          if [ "$RUNNER_OS" = macOS ]; then fetch=ON; fi
          cmake -S desktop -B desktop/build -DCMAKE_BUILD_TYPE=Release -DDRIVEWIRE_FETCH_WX=$fetch -DDRIVEWIRE_SERVER="$(swift build --package-path swift -c release --show-bin-path)/drivewire-server"
          cmake --build desktop/build --parallel 4
          if [ "$RUNNER_OS" = macOS ]; then
            python3 scripts/test-desktop.py "desktop/build/DriveWire Desktop.app/Contents/MacOS/DriveWire Desktop" --server "desktop/build/DriveWire Desktop.app/Contents/MacOS/drivewire-server"
          else
            xvfb-run -a python3 scripts/test-desktop.py "desktop/build/DriveWire Desktop" --server desktop/build/drivewire-server
          fi
      - name: Package desktop
        shell: bash
        run: python scripts/package-desktop.py --build desktop/build --output desktop/dist
      - uses: actions/upload-artifact@v4
        with:
          name: drivewire-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/dist/*.zip
            desktop/dist/*.tar.gz
